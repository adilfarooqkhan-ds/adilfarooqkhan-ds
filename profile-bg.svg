<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB">
        <animate attributeName="stop-color"
          values="#2563EB;#7C3AED;#0891B2;#DB2777;#2563EB"
          dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06B6D4">
        <animate attributeName="stop-color"
          values="#06B6D4;#DB2777;#2563EB;#7C3AED;#06B6D4"
          dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>

  <circle cx="1050" cy="60" r="100" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="120" cy="270" r="150" fill="#FFFFFF" opacity="0.05"/>

  <path d="M0 230 Q300 160 600 230 T1200 210"
    stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" fill="none"/>

  <path d="M0 250 Q300 180 600 250 T1200 230"
    stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" fill="none"/>

  <text x="600" y="115"
    font-family="Arial, sans-serif"
    font-size="48"
    font-weight="bold"
    fill="#FFFFFF"
    text-anchor="middle">
    Hey, I'm Adil Farooq Khan
  </text>

  <text x="600" y="170"
    font-family="Arial, sans-serif"
    font-size="25"
    font-weight="500"
    fill="#FFFFFF"
    text-anchor="middle">
    Python Developer | Data Science | Tech Explorer
  </text>

  <text x="600" y="220"
    font-family="Arial, sans-serif"
    font-size="20"
    fill="#FFFFFF"
    text-anchor="middle"
    opacity="0.9">
    Code. Learn. Build.
  </text>

</svg>
